name: Android APK Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.VYBORA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VYBORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VYBORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VYBORA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Configure VYBORA_KEYSTORE_BASE64 in repository Actions secrets."; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Configure VYBORA_KEYSTORE_PASSWORD in repository Actions secrets."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Configure VYBORA_KEY_ALIAS in repository Actions secrets."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Configure VYBORA_KEY_PASSWORD in repository Actions secrets."; exit 1; }
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Decode release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VYBORA_KEYSTORE_BASE64 }}
        run: |
          printf "%s" "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vybora-release.jks"
          echo "VYBORA_KEYSTORE_PATH=$RUNNER_TEMP/vybora-release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          VYBORA_KEYSTORE_PASSWORD: ${{ secrets.VYBORA_KEYSTORE_PASSWORD }}
          VYBORA_KEY_ALIAS: ${{ secrets.VYBORA_KEY_ALIAS }}
          VYBORA_KEY_PASSWORD: ${{ secrets.VYBORA_KEY_PASSWORD }}
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then VERSION_NAME="0.3.${GITHUB_RUN_NUMBER}"; fi
          ./gradlew --no-daemon :app:assembleRelease -PversionCode="$GITHUB_RUN_NUMBER" -PversionName="$VERSION_NAME"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/vybora-release.apk
          sha256sum release/vybora-release.apk | tee release/SHA256SUMS.txt
      - name: Publish APK release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.run_number }}"
          generate_release_notes: true
          files: |
            release/vybora-release.apk
            release/SHA256SUMS.txt
      - name: Upload test APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: vybora-release-apk
          path: release/
          retention-days: 14
