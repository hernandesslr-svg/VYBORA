name: Build Vybora APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '.github/workflows/build-vybora.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools,platforms;android-35,build-tools;35.0.0

      - name: Verificar projeto
        shell: bash
        run: |
          echo "Arquivos do repositório:"
          ls -la

          echo "Procurando Gradle Wrapper:"
          find . -maxdepth 6 -type f -name gradlew -print

          if [ ! -f "./gradlew" ]; then
            echo "::error::gradlew não encontrado na raiz do repositório."
            exit 1
          fi

          chmod +x ./gradlew

      - name: Compilar APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Vybora-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
