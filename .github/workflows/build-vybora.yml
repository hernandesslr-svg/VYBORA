name: Build Vybora APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '.github/workflows/build-vybora.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar estrutura do projeto
        shell: bash
        run: |
          set -eu

          echo "Diretório atual:"
          pwd

          echo "Arquivos na raiz:"
          ls -la

          echo "Procurando Gradle Wrapper..."
          find . -maxdepth 5 -type f \
            \( -name gradlew -o -name gradlew.bat -o -name settings.gradle -o -name settings.gradle.kts \) \
            -print

          if [ ! -f "./gradlew" ]; then
            echo "::error::Não existe gradlew na raiz do repositório."
            echo "O projeto pode estar em uma subpasta ou não conter um projeto Gradle."
            exit 1
          fi

          chmod +x ./gradlew

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Compilar APK
        shell: bash
        run: |
          set -eu
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Vybora-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
