name: Build VYBORA APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-vybora.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto Android
        shell: bash
        run: |
          set -e
          mkdir -p extracted

          PROJECT_ZIP="$(find . -maxdepth 1 -type f \
            -iname 'VYBORA-ANDROID-BASE-*.zip' | head -n 1)"

          if [ -z "$PROJECT_ZIP" ]; then
            echo "ERRO: ZIP do projeto VYBORA nao encontrado."
            exit 1
          fi

          unzip -q "$PROJECT_ZIP" -d extracted

          echo "Manifestos encontrados:"
          find extracted -type f -name AndroidManifest.xml -print

      - name: Corrigir caminho do manifesto
        shell: bash
        run: |
          set -e

          MANIFEST="extracted/VYBORA/app/AndroidManifest.xml"
          DEST="extracted/VYBORA/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERRO: manifesto original nao encontrado: $MANIFEST"
            exit 1
          fi

          mkdir -p "$(dirname "$DEST")"
          cp "$MANIFEST" "$DEST"

          echo "Manifesto copiado para: $DEST"
          test -s "$DEST"

      - name: Validar projeto Gradle
        shell: bash
        run: |
          set -e
          cd extracted/VYBORA

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "ERRO: arquivo settings.gradle nao encontrado."
            exit 1
          fi

          if [ ! -f app/build.gradle ] && \
             [ ! -f app/build.gradle.kts ]; then
            echo "ERRO: configuracao Gradle do app nao encontrada."
            exit 1
          fi

          if [ ! -f gradlew ]; then
            echo "ERRO: Gradle Wrapper nao encontrado na raiz."
            exit 1
          fi

          chmod +x gradlew

      - name: Compilar APK debug
        shell: bash
        run: |
          set -e
          cd extracted/VYBORA
          ./gradlew assembleDebug --no-daemon

      - name: Enviar APK para download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VYBORA-APK
          path: extracted/VYBORA/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
