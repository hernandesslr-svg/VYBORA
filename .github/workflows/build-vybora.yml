name: Build Vybora APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '.github/workflows/build-vybora.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Diagnosticar arquivos do projeto
        shell: bash
        run: |
          echo "RAIZ DO REPOSITÓRIO"
          pwd
          ls -la

          echo "WORKFLOWS DISPONÍVEIS"
          find .github/workflows -maxdepth 2 -type f -print 2>/dev/null || true

          echo "ARQUIVOS GRADLE"
          find . -maxdepth 7 -type f \
            \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) \
            -print

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Compilar APK
        shell: bash
        run: |
          set -eu

          if [ ! -f "./gradlew" ]; then
            echo "::error::Gradle Wrapper não encontrado na raiz. Verifique o diagnóstico anterior."
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Vybora-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
