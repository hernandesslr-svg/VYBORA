name: Build Vybora APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-vybora.yml'
      - 'VYBORA-POSTAR-CORRIGIDO-7.zip'

permissions:
  contents: read

jobs:
  build:
    name: Compile VYBORA from Build 72 source archive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages (same method as successful Build 72)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found in $SDK_ROOT/cmdline-tools"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Extract the exact source archive used by Build 72
        shell: bash
        run: |
          set -euo pipefail
          test -f VYBORA-POSTAR-CORRIGIDO-7.zip
          mkdir -p .build-source
          unzip -q VYBORA-POSTAR-CORRIGIDO-7.zip -d .build-source
          WRAPPER="$(find .build-source -type f -name gradlew -not -path '*/.gradle/*' -print -quit)"
          test -n "$WRAPPER" || { echo "::error::ZIP has no Gradle Wrapper"; exit 1; }
          PROJECT_DIR="$(cd "$(dirname "$WRAPPER")" && pwd)"
          test -f "$PROJECT_DIR/settings.gradle" -o -f "$PROJECT_DIR/settings.gradle.kts"
          chmod +x "$PROJECT_DIR/gradlew"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Selected project: $PROJECT_DIR"
          ls -l "$PROJECT_DIR"/settings.gradle*

      - name: Apply the Build 72 reviewed source fixes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/hernandesslr-svg/VYBORA/bf3da504dccd8f30f312c1e3c2384bfc190f8f30/scripts/apply-vybora-ui-fixes.py \
            -o /tmp/apply-vybora-ui-fixes.py
          python3 /tmp/apply-vybora-ui-fixes.py "$PROJECT_DIR"

      - name: Fix Google account reauthentication fallback in Android source
        shell: bash
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          candidates = list(root.rglob("MainActivity.kt"))
          if not candidates:
              raise SystemExit("MainActivity.kt was not found in the Build 72 source archive.")

          # Select the activity that actually implements the Google Credential Manager flow.
          matches = []
          for p in candidates:
              s = p.read_text(encoding="utf-8")
              if "GetGoogleIdOption" in s or "GetSignInWithGoogleOption" in s or "NoCredentialException" in s:
                  matches.append((p, s))
          if not matches:
              raise SystemExit("No Google Credential Manager login implementation was found in MainActivity.kt.")

          p, s = matches[0]
          # Handle any Credential Manager exception through the explicit Google chooser.
          # Preserve cancellation when the code uses the standard cancellation exception.
          s2 = re.sub(
              r'catch\s*\(\s*_\s*:\s*androidx\.credentials\.exceptions\.NoCredentialException\s*\)',
              'catch (e: androidx.credentials.exceptions.GetCredentialException)',
              s,
              count=1,
          )
          if s2 == s and "catch (e: androidx.credentials.exceptions.GetCredentialException)" not in s:
              # Handle variants where the caught exception is imported or named differently.
              s2, n = re.subn(
                  r'catch\s*\(\s*\w+\s*:\s*(?:androidx\.credentials\.exceptions\.)?NoCredentialException\s*\)',
                  'catch (e: androidx.credentials.exceptions.GetCredentialException)',
                  s,
                  count=1,
              )
              if n == 0:
                  raise SystemExit(f"Google credential fallback catch was not found in {p}; refusing to build unchanged.")
          p.write_text(s2, encoding="utf-8")
          print(f"Patched Google credential fallback in {p}")
          for i, line in enumerate(s2.splitlines(), 1):
              if "GetCredentialException" in line or "NoCredentialException" in line or "GetSignInWithGoogleOption" in line:
                  print(f"{i}: {line.strip()}")
          PY

      - name: Fix Properties import in Kotlin DSL (required by Build 72)
        shell: bash
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          FILE="$PROJECT_DIR/app/build.gradle.kts"
          if [ -f "$FILE" ] && grep -q 'java.util.Properties()' "$FILE"; then
            sed -i '1i import java.util.Properties' "$FILE"
            sed -i 's/java\.util\.Properties()/Properties()/g' "$FILE"
          fi
          sed -n '1,24p' "$FILE"

      - name: Set the real Railway API URL in the Android app
        shell: bash
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          FILE="$PROJECT_DIR/app/build.gradle.kts"
          test -f "$FILE"
          sed -i 's#https://configure-your-vybora-api\.example#https://vybora-production.up.railway.app#g' "$FILE"
          grep -q 'https://vybora-production.up.railway.app' "$FILE" || { echo "::error::Railway API URL was not configured"; exit 1; }
          if grep -q 'configure-your-vybora-api\.example' "$FILE"; then
            echo "::error::Placeholder API URL remains in Android build configuration"
            exit 1
          fi
          grep 'API_BASE_URL' "$FILE"

      - name: Validate persistent Build 72 Google OAuth configuration
        shell: bash
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          CONFIG="$GITHUB_WORKSPACE/config/google-oauth-build72.properties"
          test -f "$CONFIG" || { echo "::error::Missing persistent Build 72 OAuth configuration"; exit 1; }
          source "$CONFIG"
          test "$ANDROID_APPLICATION_ID" = "app.vybora.android"
          test "$ANDROID_OAUTH_CLIENT_ID" = "491553779497-75helub1i21c7tfa9e3v2krpdbj73juv.apps.googleusercontent.com"
          test "$WEB_OAUTH_CLIENT_ID" = "491553779497-llnliort4rsqu1ijna960e417tpt82rv.apps.googleusercontent.com"
          grep -R -q --include='*.gradle' --include='*.gradle.kts' --include='AndroidManifest.xml' 'app.vybora.android' "$PROJECT_DIR/app"
          echo "Build 72 OAuth identifiers are present and validated."
          echo "Android package: $ANDROID_APPLICATION_ID"
          echo "Android OAuth client: $ANDROID_OAUTH_CLIENT_ID"
          echo "Web OAuth client: $WEB_OAUTH_CLIENT_ID"
          echo "Expected Build 72 certificate SHA-1: $BUILD72_CERTIFICATE_SHA1"

      - name: Configure VYBORA release signing
        shell: bash
        env:
          VYBORA_KEYSTORE_BASE64: ${{ secrets.VYBORA_KEYSTORE_BASE64 }}
          VYBORA_KEYSTORE_PASSWORD: ${{ secrets.VYBORA_KEYSTORE_PASSWORD }}
          VYBORA_KEY_ALIAS: ${{ secrets.VYBORA_KEY_ALIAS }}
          VYBORA_KEY_PASSWORD: ${{ secrets.VYBORA_KEY_PASSWORD }}
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          for name in VYBORA_KEYSTORE_BASE64 VYBORA_KEYSTORE_PASSWORD VYBORA_KEY_ALIAS VYBORA_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/VYBORA-release.jks"
          printf '%s' "$VYBORA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$VYBORA_KEYSTORE_PASSWORD" -alias "$VYBORA_KEY_ALIAS" >/dev/null
          echo "VYBORA_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['PROJECT_DIR']) / 'app' / 'build.gradle.kts'
          if not p.is_file():
              raise SystemExit(f'Missing Gradle Kotlin build file: {p}')
          s = p.read_text(encoding='utf-8')
          marker = 'create("vyboraRelease")'
          if marker in s:
              raise SystemExit('Signing configuration already exists; refusing to inject it twice.')
          s += '''\n\n// Added by the GitHub Actions workflow; signing material is supplied only through environment variables.\nsigningConfigs {\n    create("vyboraRelease") {\n        storeFile = file(System.getenv("VYBORA_KEYSTORE_PATH"))\n        storePassword = System.getenv("VYBORA_KEYSTORE_PASSWORD")\n        keyAlias = System.getenv("VYBORA_KEY_ALIAS")\n        keyPassword = System.getenv("VYBORA_KEY_PASSWORD")\n    }\n}\nbuildTypes {\n    getByName("release") {\n        signingConfig = signingConfigs.getByName("vyboraRelease")\n    }\n}\n'''
          p.write_text(s, encoding='utf-8')
          print('Configured release signing without writing credentials into the repository.')
          PY

      - name: Build and verify signed release APK
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || '491553779497-llnliort4rsqu1ijna960e417tpt82rv.apps.googleusercontent.com' }}
          VYBORA_KEYSTORE_PASSWORD: ${{ secrets.VYBORA_KEYSTORE_PASSWORD }}
          VYBORA_KEY_ALIAS: ${{ secrets.VYBORA_KEY_ALIAS }}
          VYBORA_KEY_PASSWORD: ${{ secrets.VYBORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew assembleRelease -PGOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" --no-daemon --stacktrace
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" || { echo "::error::Signed release APK was not generated"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/artifacts/Vybora-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$GITHUB_WORKSPACE/artifacts/Vybora-release.apk"
          ACTUAL_SHA1="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$GITHUB_WORKSPACE/artifacts/Vybora-release.apk" | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' | head -n1 | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA1='4B:E4:31:84:70:0B:86:CF:3A:32:60:4F:74:09:DE:94:17:2A:CB:3A'
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::APK certificate SHA-1 mismatch. Expected $EXPECTED_SHA1, got $ACTUAL_SHA1"
            exit 1
          fi
          echo "Verified signing SHA-1: $ACTUAL_SHA1"
          ls -lh "$GITHUB_WORKSPACE/artifacts/Vybora-release.apk"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VYBORA-release-signed-APK
          path: artifacts/Vybora-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VYBORA-Build-72-build-reports
          path: |
            .build-source/**/build/reports/
            .build-source/**/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
