name: Build VYBORA APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-vybora.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'

permissions:
  contents: read

jobs:
  build:
    name: Build maintained Android source from main
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found in $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Validate Android source and OAuth configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/app/vybora/android/MainActivity.kt
          test -f app/src/main/java/app/vybora/android/GoogleSignIn.kt
          test -f app/src/main/java/app/vybora/android/VyboraApi.kt
          grep -q 'app.vybora.android' app/build.gradle.kts
          grep -q 'api/auth/google' app/src/main/java/app/vybora/android/VyboraApi.kt
          grep -q 'Continuar com Google' app/src/main/java/app/vybora/android/MainActivity.kt
          grep -q 'GoogleSignIn.signInIntent(activity)' app/src/main/java/app/vybora/android/MainActivity.kt
          grep -q 'GoogleSignIn.idTokenFromResult(result.data)' app/src/main/java/app/vybora/android/MainActivity.kt
          grep -q 'play-services-auth' app/build.gradle.kts
          grep -q 'credentials-play-services-auth' app/build.gradle.kts

      - name: Configure original VYBORA release signing
        shell: bash
        env:
          VYBORA_KEYSTORE_BASE64: ${{ secrets.VYBORA_KEYSTORE_BASE64 }}
          VYBORA_KEYSTORE_PASSWORD: ${{ secrets.VYBORA_KEYSTORE_PASSWORD }}
          VYBORA_KEY_ALIAS: ${{ secrets.VYBORA_KEY_ALIAS }}
          VYBORA_KEY_PASSWORD: ${{ secrets.VYBORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in VYBORA_KEYSTORE_BASE64 VYBORA_KEYSTORE_PASSWORD VYBORA_KEY_ALIAS VYBORA_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Configure the existing original VYBORA release keystore secrets; do not generate a new keystore."
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/vybora-signing"
          printf '%s' "$VYBORA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vybora-signing/VYBORA-release.jks"
          test -s "$RUNNER_TEMP/vybora-signing/VYBORA-release.jks"
          echo "VYBORA_KEYSTORE_PATH=$RUNNER_TEMP/vybora-signing/VYBORA-release.jks" >> "$GITHUB_ENV"
          echo "VYBORA_KEYSTORE_PASSWORD=$VYBORA_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "VYBORA_KEY_ALIAS=$VYBORA_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "VYBORA_KEY_PASSWORD=$VYBORA_KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$RUNNER_TEMP/vybora-signing/VYBORA-release.jks" -storepass "$VYBORA_KEYSTORE_PASSWORD" -alias "$VYBORA_KEY_ALIAS" | grep -F "4B:E4:31:84:70:0B:86:CF:3A:32:60:4F:74:09:DE:94:17:2A:CB:3A"

      - name: Build and verify release APK with original certificate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "::error::Release APK was not generated at $APK"; exit 1; }
          mkdir -p artifacts
          cp "$APK" artifacts/Vybora-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose artifacts/Vybora-release.apk
          CERT_INFO="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs artifacts/Vybora-release.apk)"
          printf '%s\\n' "$CERT_INFO"
          ACTUAL_SHA1="$(printf '%s\\n' "$CERT_INFO" | sed -n 's/.*Signer #1 certificate SHA-1 digest: *//p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_SHA1="4be43184700b86cf3a32604f7409de94172acb3a"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::APK certificate SHA-1 does not match the expected VYBORA OAuth certificate."
            echo "Expected SHA-1: $EXPECTED_SHA1"
            echo "Actual SHA-1: $ACTUAL_SHA1"
            exit 1
          fi
          echo "Verified original VYBORA OAuth signing certificate: $ACTUAL_SHA1"
          ls -lh artifacts/Vybora-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: VYBORA-main-signed-release-APK
          path: artifacts/Vybora-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VYBORA-main-build-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
