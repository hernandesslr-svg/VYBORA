name: Build Vybora APK

# Build on demand, on version tags, or when the Android fix script/workflow changes on the working branch.
on:
  workflow_dispatch:
  push:
    branches:
      - fix/android-ci-sdk-and-source-archive
    paths:
      - '.github/workflows/build-vybora.yml'
      - 'scripts/apply-vybora-ui-fixes.py'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Compile Vybora Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas Android
        shell: bash
        run: |
          set -eu
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager não encontrado em $SDK_ROOT/cmdline-tools."
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Localizar ou extrair projeto Android
        id: project
        shell: bash
        run: |
          set -eu
          WRAPPER="$(find . -type f -name gradlew -not -path './.git/*' -not -path '*/.gradle/*' -not -path '*/.build-source/*' -print -quit || true)"
          if [ -z "$WRAPPER" ]; then
            ARCHIVE="$(find . -maxdepth 3 -type f -name 'VYBORA-POSTAR-CORRIGIDO-7.zip' -print -quit)"
            if [ -z "$ARCHIVE" ]; then
              echo "::error::Não encontrei gradlew nem o ZIP VYBORA-POSTAR-CORRIGIDO-7.zip."
              exit 1
            fi
            mkdir -p .build-source
            unzip -q "$ARCHIVE" -d .build-source
            WRAPPER="$(find .build-source -type f -name gradlew -not -path '*/.gradle/*' -print -quit || true)"
          fi
          if [ -z "$WRAPPER" ]; then
            echo "::error::Nenhum Gradle Wrapper foi encontrado, mesmo após extrair o ZIP."
            exit 1
          fi
          PROJECT_DIR="$(cd "$(dirname "$WRAPPER")" && pwd)"
          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::O diretório do Gradle Wrapper não contém settings.gradle(.kts): $PROJECT_DIR"
            exit 1
          fi
          chmod +x "$PROJECT_DIR/gradlew"
          echo "Projeto localizado em: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Aplicar correções solicitadas no aplicativo
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -eu
          python3 scripts/apply-vybora-ui-fixes.py "$PROJECT_DIR"

      - name: Corrigir import Properties no build Kotlin DSL
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -eu
          FILE="$PROJECT_DIR/app/build.gradle.kts"
          if [ -f "$FILE" ] && grep -q 'java.util.Properties()' "$FILE"; then
            sed -i '1i import java.util.Properties' "$FILE"
            sed -i 's/java\.util\.Properties()/Properties()/g' "$FILE"
          fi
          echo "Trecho de configuração:"
          sed -n '1,24p' "$FILE"

      - name: Compilar APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID || vars.GOOGLE_WEB_CLIENT_ID || '491553779497-llnliort4rsqu1ijna960e417tpt82rv.apps.googleusercontent.com' }}
        run: |
          set -eu
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug -PGOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" --no-daemon --stacktrace

      - name: Verificar APK
        shell: bash
        run: |
          set -eu
          APK="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -not -path '*/.gradle/*' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Nenhum APK de debug foi gerado."
            exit 1
          fi
          echo "APK gerado: $APK"
          ls -lh "$APK"

      - name: Preparar APK para publicação
        shell: bash
        run: |
          set -eu
          APK="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -not -path '*/.gradle/*' -print -quit)"
          test -n "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/Vybora-debug.apk
          ls -lh artifacts/Vybora-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Vybora-APK
          path: artifacts/Vybora-debug.apk
          if-no-files-found: error
          retention-days: 7
