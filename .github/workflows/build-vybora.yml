name: Build VYBORA APK

'on':
workflow_dispatch:
push:
paths:
- '**.zip'
- '.github/workflows/build-vybora.yml'

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Baixar arquivos do repositorio
    uses: actions/checkout@v4

  - name: Preparar Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Preparar Android SDK
    uses: android-actions/setup-android@v3

  - name: Localizar e extrair projeto
    shell: bash
    run: |
      set -euo pipefail
      mkdir -p extracted

      PROJECT_ZIP="VYBORA-ANDROID-CORRIGIDO.zip"

      if [ ! -f "$PROJECT_ZIP" ]; then
        echo "ERRO: ZIP corrigido nao encontrado na raiz."
        find . -maxdepth 1 -name '*.zip' -print
        exit 1
      fi

      unzip -q "$PROJECT_ZIP" -d extracted

      if [ ! -d extracted/VYBORA ]; then
        echo "ERRO: o ZIP nao contem a pasta VYBORA esperada."
        find extracted -maxdepth 3 -type f -print
        exit 1
      fi

  - name: Preparar manifesto
    shell: bash
    run: |
      set -euo pipefail
      cd extracted/VYBORA

      if [ -s app/AndroidManifest.xml ]; then
        mkdir -p app/src/main
        cp app/AndroidManifest.xml app/src/main/AndroidManifest.xml
      elif [ ! -s app/src/main/AndroidManifest.xml ]; then
        echo "ERRO: manifesto Android nao encontrado."
        exit 1
      fi

  - name: Validar arquivos Gradle
    shell: bash
    run: |
      set -euo pipefail
      cd extracted/VYBORA

      test -f settings.gradle.kts || test -f settings.gradle
      test -f app/build.gradle.kts || test -f app/build.gradle
      test -f gradlew
      chmod +x gradlew

  - name: Compilar APK
    shell: bash
    run: |
      set -euo pipefail
      cd extracted/VYBORA
      ./gradlew assembleDebug --no-daemon --stacktrace

  - name: Verificar APK
    shell: bash
    run: |
      set -euo pipefail
      test -s extracted/VYBORA/app/build/outputs/apk/debug/app-debug.apk
      ls -lh extracted/VYBORA/app/build/outputs/apk/debug/app-debug.apk

  - name: Disponibilizar APK
    uses: actions/upload-artifact@v4
    with:
      name: VYBORA-APK
      path: extracted/VYBORA/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 7
