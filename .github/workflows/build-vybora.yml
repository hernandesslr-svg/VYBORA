name: Build Vybora APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-vybora.yml'
      - 'VYBORA-POSTAR-CORRIGIDO-7.zip'
      - 'app/**'
      - 'scripts/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'

permissions:
  contents: read

jobs:
  build:
    name: Compile VYBORA from Build 72 source archive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages (same method as successful Build 72)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found in $SDK_ROOT/cmdline-tools"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Compile maintained Android app source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Smoke-test deployed Railway API
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://vybora-production.up.railway.app"
          curl --fail --silent --show-error --max-time 20 "$BASE/health" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status") == "ok", d; print("Railway health:", d.get("status"), d.get("database"))'
          curl --fail --silent --show-error --max-time 20 "$BASE/api/users/search?q=vy" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d.get("users"), list), d; print("Global search route: OK; returned", len(d["users"]), "users")'
          curl --fail --silent --show-error --max-time 20 "$BASE/api/search?q=vy" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d.get("users"), list) and isinstance(d.get("posts"), list), d; print("Combined search route: OK; returned", len(d["users"]), "users and", len(d["posts"]), "posts")'
          curl --fail --silent --show-error --max-time 20 "$BASE/api/app-config" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert "searchEnabled" in d and "publishingEnabled" in d, d; print("Remote app config: OK")'

      - name: Extract the exact source archive used by Build 72
        shell: bash
        run: |
          set -euo pipefail
          test -f VYBORA-POSTAR-CORRIGIDO-7.zip
          mkdir -p .build-source
          unzip -q VYBORA-POSTAR-CORRIGIDO-7.zip -d .build-source
          WRAPPER="$(find .build-source -type f -name gradlew -not -path '*/.gradle/*' -print -quit)"
          test -n "$WRAPPER" || { echo "::error::ZIP has no Gradle Wrapper"; exit 1; }
          PROJECT_DIR="$(cd "$(dirname "$WRAPPER")" && pwd)"
          test -f "$PROJECT_DIR/settings.gradle" -o -f "$PROJECT_DIR/settings.gradle.kts"
          chmod +x "$PROJECT_DIR/gradlew"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Selected project: $PROJECT_DIR"
          ls -l "$PROJECT_DIR"/settings.gradle*

      - name: Inspect Build 72 source entry points for feature patching
        shell: bash
        run: |
          set -euo pipefail
          echo "=== MainActivity and API source files ==="
          find "$PROJECT_DIR" -type f \( -name 'MainActivity.kt' -o -name 'VyboraApi.kt' \) -print
          while IFS= read -r FILE; do
            echo "=== $FILE ==="
            grep -n -E 'GetGoogleIdOption|GetSignInWithGoogleOption|NoCredentialException|fun .*Page|api/users/search|api/posts|updateProfile|Configurar transmissão|Publicação|mensagens reais|demonstração' "$FILE" | head -100 || true
          done < <(find "$PROJECT_DIR" -type f \( -name 'MainActivity.kt' -o -name 'VyboraApi.kt' \) -print)
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["PROJECT_DIR"])
          main = next(root.rglob("MainActivity.kt"))
          source = main.read_text(encoding="utf-8")
          for term in ["private fun VyboraApp", "private fun SearchPage", "private fun MessagesPage", "private fun ProfilePage", "private fun EditProfilePage", "private fun PostPage", "private fun LivePage", "private fun SettingsPage"]:
              index = source.find(term)
              if index >= 0:
                  print("\\n=== SOURCE EXCERPT:", term, "===")
                  print(source[index:index+6500])
          for api in root.rglob("VyboraApi.kt"):
              text = api.read_text(encoding="utf-8")
              print("\\n=== API METHOD EXCERPTS:", api, "===")
              for term in ["fun updateProfile", "fun searchUsers", "fun getPosts", "fun createMediaPost", "fun uploadPostMedia", "fun getMessages", "fun toggleLike"]:
                  index = text.find(term)
                  if index >= 0: print(text[index:index+1800])
              print('\\n=== COMPLETE API SOURCE ===')
              print(text)
          PY

      - name: Apply the Build 72 reviewed source fixes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/hernandesslr-svg/VYBORA/bf3da504dccd8f30f312c1e3c2384bfc190f8f30/scripts/apply-vybora-ui-fixes.py \
            -o /tmp/apply-vybora-ui-fixes.py
          python3 /tmp/apply-vybora-ui-fixes.py "$PROJECT_DIR"

      - name: Apply reviewed social feature fixes to Build 72 source
        shell: bash
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 scripts/apply-vybora-feature-fixes.py "$PROJECT_DIR"

      - name: Apply the maintained native camera to the exact APK source
        shell: bash
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 scripts/apply-vybora-camera-fixes.py "$PROJECT_DIR" "$GITHUB_WORKSPACE"

      - name: Fix Google account reauthentication fallback in Android source
        shell: bash
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          candidates = list(root.rglob("MainActivity.kt"))
          if not candidates:
              raise SystemExit("MainActivity.kt was not found in the Build 72 source archive.")

          # Select the activity that actually implements the Google Credential Manager flow.
          matches = []
          for p in candidates:
              s = p.read_text(encoding="utf-8")
              if "GetGoogleIdOption" in s or "GetSignInWithGoogleOption" in s or "NoCredentialException" in s:
                  matches.append((p, s))
          if not matches:
              raise SystemExit("No Google Credential Manager login implementation was found in MainActivity.kt.")

          p, s = matches[0]
          # Handle any Credential Manager exception through the explicit Google chooser.
          # Preserve cancellation when the code uses the standard cancellation exception.
          s2 = re.sub(
              r'catch\s*\(\s*_\s*:\s*androidx\.credentials\.exceptions\.NoCredentialException\s*\)',
              'catch (e: androidx.credentials.exceptions.GetCredentialException)',
              s,
              count=1,
          )
          if s2 == s and "catch (e: androidx.credentials.exceptions.GetCredentialException)" not in s:
              # Handle variants where the caught exception is imported or named differently.
              s2, n = re.subn(
                  r'catch\s*\(\s*\w+\s*:\s*(?:androidx\.credentials\.exceptions\.)?NoCredentialException\s*\)',
                  'catch (e: androidx.credentials.exceptions.GetCredentialException)',
                  s,
                  count=1,
              )
              if n == 0:
                  raise SystemExit(f"Google credential fallback catch was not found in {p}; refusing to build unchanged.")
          p.write_text(s2, encoding="utf-8")
          print(f"Patched Google credential fallback in {p}")
          for i, line in enumerate(s2.splitlines(), 1):
              if "GetCredentialException" in line or "NoCredentialException" in line or "GetSignInWithGoogleOption" in line:
                  print(f"{i}: {line.strip()}")
          PY

      - name: Fix Properties import in Kotlin DSL (required by Build 72)
        shell: bash
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          FILE="$PROJECT_DIR/app/build.gradle.kts"
          if [ -f "$FILE" ] && grep -q 'java.util.Properties()' "$FILE"; then
            sed -i '1i import java.util.Properties' "$FILE"
            sed -i 's/java\.util\.Properties()/Properties()/g' "$FILE"
          fi
          sed -n '1,24p' "$FILE"

      - name: Set the real Railway API URL in the Android app
        shell: bash
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          FILE="$PROJECT_DIR/app/build.gradle.kts"
          test -f "$FILE"
          sed -i 's#https://configure-your-vybora-api\.example#https://vybora-production.up.railway.app#g' "$FILE"
          grep -q 'https://vybora-production.up.railway.app' "$FILE" || { echo "::error::Railway API URL was not configured"; exit 1; }
          if grep -q 'configure-your-vybora-api\.example' "$FILE"; then
            echo "::error::Placeholder API URL remains in Android build configuration"
            exit 1
          fi
          grep 'API_BASE_URL' "$FILE"

      - name: Validate persistent Build 72 Google OAuth configuration
        shell: bash
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          CONFIG="$GITHUB_WORKSPACE/config/google-oauth-build72.properties"
          test -f "$CONFIG" || { echo "::error::Missing persistent Build 72 OAuth configuration"; exit 1; }
          source "$CONFIG"
          test "$ANDROID_APPLICATION_ID" = "app.vybora.android"
          test "$ANDROID_OAUTH_CLIENT_ID" = "491553779497-75helub1i21c7tfa9e3v2krpdbj73juv.apps.googleusercontent.com"
          test "$WEB_OAUTH_CLIENT_ID" = "491553779497-llnliort4rsqu1ijna960e417tpt82rv.apps.googleusercontent.com"
          grep -R -q --include='*.gradle' --include='*.gradle.kts' --include='AndroidManifest.xml' 'app.vybora.android' "$PROJECT_DIR/app"
          echo "Build 72 OAuth identifiers are present and validated."
          echo "Android package: $ANDROID_APPLICATION_ID"
          echo "Android OAuth client: $ANDROID_OAUTH_CLIENT_ID"
          echo "Web OAuth client: $WEB_OAUTH_CLIENT_ID"
          echo "Expected Build 72 certificate SHA-1: $BUILD72_CERTIFICATE_SHA1"

      - name: Configure VYBORA release signing
        shell: bash
        env:
          VYBORA_KEYSTORE_BASE64: ${{ secrets.VYBORA_KEYSTORE_BASE64 }}
          VYBORA_KEYSTORE_PASSWORD: ${{ secrets.VYBORA_KEYSTORE_PASSWORD }}
          VYBORA_KEY_ALIAS: ${{ secrets.VYBORA_KEY_ALIAS }}
          VYBORA_KEY_PASSWORD: ${{ secrets.VYBORA_KEY_PASSWORD }}
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          for name in VYBORA_KEYSTORE_BASE64 VYBORA_KEYSTORE_PASSWORD VYBORA_KEY_ALIAS VYBORA_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/VYBORA-release.jks"
          printf '%s' "$VYBORA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$VYBORA_KEYSTORE_PASSWORD" -alias "$VYBORA_KEY_ALIAS" >/dev/null
          echo "VYBORA_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['PROJECT_DIR']) / 'app' / 'build.gradle.kts'
          if not p.is_file():
              raise SystemExit(f'Missing Gradle Kotlin build file: {p}')
          s = p.read_text(encoding='utf-8')
          marker = 'create("vyboraRelease")'
          if marker in s:
              raise SystemExit('Signing configuration already exists; refusing to inject it twice.')
          # Inject the signing DSL inside android { ... }; file-scope signingConfigs/buildTypes are invalid.
          start = s.find('android {')
          if start < 0:
              raise SystemExit('No android { block found in app/build.gradle.kts')
          depth = 0
          end = None
          in_string = False
          escape = False
          for i in range(start + len('android'), len(s)):
              ch = s[i]
              if in_string:
                  if escape:
                      escape = False
                  elif ch == '\\\\':
                      escape = True
                  elif ch == '"':
                      in_string = False
                  continue
              if ch == '"':
                  in_string = True
              elif ch == '{':
                  depth += 1
              elif ch == '}':
                  depth -= 1
                  if depth == 0:
                      end = i
                      break
          if end is None:
              raise SystemExit('Could not locate end of android { ... } block')
          block = '''
          
              // Signing material is supplied only through GitHub Actions environment variables.
              signingConfigs {
                  create("vyboraRelease") {
                      storeFile = file(System.getenv("VYBORA_KEYSTORE_PATH"))
                      storePassword = System.getenv("VYBORA_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("VYBORA_KEY_ALIAS")
                      keyPassword = System.getenv("VYBORA_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("vyboraRelease")
                  }
              }
          '''
          s = s[:end] + block + s[end:]
          p.write_text(s, encoding='utf-8')
          print('Configured release signing without writing credentials into the repository.')
          PY

      - name: Bump Build 72 APK version so the camera update installs over the previous app
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = list(Path(".").rglob("app/build.gradle.kts"))
          if len(candidates) != 1:
              raise SystemExit(f"Expected one app/build.gradle.kts, found {len(candidates)}")
          path = candidates[0]
          source = path.read_text(encoding="utf-8")
          updated, count = re.subn(r'(?m)^([ \t]*versionCode[ \t]*=[ \t]*)[0-9]+([ \t]*(?:#.*)?$)', r'\\g<1>73\\g<2>', source, count=1)
          if count != 1:
              raise SystemExit("Could not safely set versionCode=73 in the Build 72 APK project.")
          updated2, name_count = re.subn(r'(?m)^([ \t]*versionName[ \t]*=[ \t]*)"[^"]+"', r'\\g<1>"0.3.1"', updated, count=1)
          if name_count == 0:
              print("versionName was not a simple literal; keeping existing name.")
          path.write_text(updated2, encoding="utf-8")
          print(f"APK update version set in {path}: versionCode=73, versionName=0.3.1")
          PY

      - name: Build and verify signed release APK
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || '491553779497-llnliort4rsqu1ijna960e417tpt82rv.apps.googleusercontent.com' }}
          VYBORA_KEYSTORE_PASSWORD: ${{ secrets.VYBORA_KEYSTORE_PASSWORD }}
          VYBORA_KEY_ALIAS: ${{ secrets.VYBORA_KEY_ALIAS }}
          VYBORA_KEY_PASSWORD: ${{ secrets.VYBORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew assembleRelease -PGOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" --no-daemon --stacktrace
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" || { echo "::error::Signed release APK was not generated"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/artifacts/Vybora-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$GITHUB_WORKSPACE/artifacts/Vybora-release.apk"
          ACTUAL_SHA1="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$GITHUB_WORKSPACE/artifacts/Vybora-release.apk" | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' | head -n1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA1='4BE43184700B86CF3A32604F7409DE94172ACB3A'
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::APK certificate SHA-1 mismatch. Expected $EXPECTED_SHA1, got $ACTUAL_SHA1"
            exit 1
          fi
          echo "Verified signing SHA-1: $ACTUAL_SHA1"
          ls -lh "$GITHUB_WORKSPACE/artifacts/Vybora-release.apk"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VYBORA-release-signed-APK
          path: artifacts/Vybora-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VYBORA-Build-72-build-reports
          path: |
            .build-source/**/build/reports/
            .build-source/**/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
