name: Build VYBORA APK

concurrency:
  group: vybora-release-build
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-vybora.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'

permissions:
  contents: read

jobs:
  build:
    name: Build APK from the maintained main source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found in $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Verify the maintained source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/app/vybora/android/MainActivity.kt
          test -f app/src/main/java/app/vybora/android/VyboraApi.kt
          test -f app/src/main/AndroidManifest.xml
          grep -q 'https://vybora-production.up.railway.app' app/build.gradle.kts
          echo "The APK source is the current main branch; no Build 72 ZIP is extracted."

      - name: Compile maintained Android source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Smoke-test deployed Railway API
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://vybora-production.up.railway.app"
          curl --fail --silent --show-error --max-time 20 "$BASE/health" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status") == "ok", d; print("Railway health:", d.get("status"), d.get("database"))'
          curl --fail --silent --show-error --max-time 20 "$BASE/api/users/search?q=vy" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d.get("users"), list), d; print("Global user search: OK")'
          curl --fail --silent --show-error --max-time 20 "$BASE/api/search?q=vy" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d.get("users"), list) and isinstance(d.get("posts"), list), d; print("Combined search: OK")'
          curl --fail --silent --show-error --max-time 20 "$BASE/api/app-config" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert "searchEnabled" in d and "publishingEnabled" in d, d; print("Remote app config: OK")'

      - name: Validate release signing secrets
        shell: bash
        env:
          VYBORA_KEYSTORE_BASE64: ${{ secrets.VYBORA_KEYSTORE_BASE64 }}
          VYBORA_KEYSTORE_PASSWORD: ${{ secrets.VYBORA_KEYSTORE_PASSWORD }}
          VYBORA_KEY_ALIAS: ${{ secrets.VYBORA_KEY_ALIAS }}
          VYBORA_KEY_PASSWORD: ${{ secrets.VYBORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in VYBORA_KEYSTORE_BASE64 VYBORA_KEYSTORE_PASSWORD VYBORA_KEY_ALIAS VYBORA_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/VYBORA-release.jks"
          printf '%s' "$VYBORA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$VYBORA_KEYSTORE_PASSWORD" -alias "$VYBORA_KEY_ALIAS" >/dev/null
          echo "VYBORA_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build and verify signed APK from main
        shell: bash
        env:
          VYBORA_KEYSTORE_PASSWORD: ${{ secrets.VYBORA_KEYSTORE_PASSWORD }}
          VYBORA_KEY_ALIAS: ${{ secrets.VYBORA_KEY_ALIAS }}
          VYBORA_KEY_PASSWORD: ${{ secrets.VYBORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease -PversionCode=73 -PversionName=0.3.1 --no-daemon --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "::error::Release APK was not generated from main"; exit 1; }
          mkdir -p artifacts
          cp "$APK" artifacts/Vybora-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs artifacts/Vybora-release.apk
          ACTUAL_SHA1="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs artifacts/Vybora-release.apk | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' | head -n1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA1='4BE43184700B86CF3A32604F7409DE94172ACB3A'
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::APK certificate SHA-1 mismatch. Expected $EXPECTED_SHA1, got $ACTUAL_SHA1"
            exit 1
          fi
          echo "Verified signing SHA-1: $ACTUAL_SHA1"
          sha256sum artifacts/Vybora-release.apk
          ls -lh artifacts/Vybora-release.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VYBORA-main-release-APK
          path: artifacts/Vybora-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VYBORA-main-build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
