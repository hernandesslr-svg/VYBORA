name: Build Vybora APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '.github/workflows/build-vybora.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile Vybora Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Usa o Android SDK já instalado na imagem ubuntu-latest.
      # Evita setup-android@v3, que falhava tentando instalar o pacote obsoleto "tools".
      - name: Instalar ferramentas Android
        shell: bash
        run: |
          set -eu

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager não encontrado em $SDK_ROOT/cmdline-tools."
            echo "Conteúdo do SDK:"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Localizar ou extrair projeto Android
        id: project
        shell: bash
        run: |
          set -eu

          echo "Verificando estrutura do repositório..."
          ls -la

          WRAPPER="$(find . -type f -name gradlew -not -path './.git/*' -not -path '*/.gradle/*' -not -path '*/.build-source/*' -print -quit || true)"

          if [ -z "$WRAPPER" ]; then
            ARCHIVE="$(find . -maxdepth 3 -type f -name 'VYBORA-POSTAR-CORRIGIDO-7.zip' -print -quit)"
            if [ -z "$ARCHIVE" ]; then
              echo "::error::Não encontrei gradlew nem o ZIP VYBORA-POSTAR-CORRIGIDO-7.zip."
              exit 1
            fi
            mkdir -p .build-source
            unzip -q "$ARCHIVE" -d .build-source
            WRAPPER="$(find .build-source -type f -name gradlew -not -path '*/.gradle/*' -print -quit || true)"
          fi

          if [ -z "$WRAPPER" ]; then
            echo "::error::Nenhum Gradle Wrapper foi encontrado, mesmo após extrair o ZIP."
            find . -maxdepth 8 -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'gradle-wrapper.properties' \) -print
            exit 1
          fi

          PROJECT_DIR="$(cd "$(dirname "$WRAPPER")" && pwd)"
          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::O diretório do Gradle Wrapper não contém settings.gradle(.kts): $PROJECT_DIR"
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"
          echo "Projeto localizado em: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -eu
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        shell: bash
        run: |
          set -eu
          APK="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -not -path '*/.gradle/*' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Nenhum APK de debug foi gerado."
            exit 1
          fi
          echo "APK gerado: $APK"
          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Vybora-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
