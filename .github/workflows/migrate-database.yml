name: Prepare VYBORA database migration

on:
  push:
    paths:
      - '.github/workflows/migrate-database.yml'
      - 'BACKEND/scripts/migrate-railway-to-supabase.js'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MIGRATE to copy Railway PostgreSQL data to the empty Supabase vybora_backend schema'
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate-database:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'MIGRATE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: BACKEND
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: BACKEND/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify and copy database data
        env:
          RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          DB_SCHEMA: vybora_backend
        run: node scripts/migrate-railway-to-supabase.js
