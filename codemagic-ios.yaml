workflows:
  vybora-ios:
    name: VYBORA - iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: "1 - Verificar projeto iOS"
        script: |
          set -eu

          echo "=== VYBORA iOS ==="

          if [ ! -d "$CM_BUILD_DIR/ios" ]; then
            echo "ERRO: pasta ios nao encontrada."
            echo "O projeto Android precisa ser adaptado para iOS."
            exit 1
          fi

          find "$CM_BUILD_DIR/ios" \
            \( -name "*.xcworkspace" -o -name "*.xcodeproj" \) \
            -print

      - name: "2 - Localizar workspace ou projeto Xcode"
        script: |
          set -eu

          cd "$CM_BUILD_DIR"

          WORKSPACE="$(find ios -maxdepth 4 \
            -name "*.xcworkspace" -print -quit || true)"

          PROJECT="$(find ios -maxdepth 4 \
            -name "*.xcodeproj" -print -quit || true)"

          if [ -n "$WORKSPACE" ]; then
            echo "BUILD_TYPE=workspace" >> "$CM_ENV"
            echo "BUILD_PATH=$WORKSPACE" >> "$CM_ENV"
          elif [ -n "$PROJECT" ]; then
            echo "BUILD_TYPE=project" >> "$CM_ENV"
            echo "BUILD_PATH=$PROJECT" >> "$CM_ENV"
          else
            echo "ERRO: nenhum workspace ou projeto Xcode encontrado."
            exit 1
          fi

      - name: "3 - Identificar esquema de compilacao"
        script: |
          set -eu

          cd "$CM_BUILD_DIR"

          if [ "$BUILD_TYPE" = "workspace" ]; then
            xcodebuild -list -workspace "$BUILD_PATH"
          else
            xcodebuild -list -project "$BUILD_PATH"
          fi

          echo "Consulte o esquema listado acima."
          echo "O nome do esquema deve ser configurado antes da compilacao."

      - name: "4 - Compilar iOS"
        script: |
          set -eu

          echo "ERRO: compilacao pausada ate configurar o esquema real."
          echo "Tambem e necessario definir assinatura para distribuir o app."
          exit 1

    artifacts:
      - build/ios/Build/Products/**/*.app
      - build/ios/Build/Products/**/*.ipa
