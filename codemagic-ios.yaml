workflows:
  vybora-ios:
    name: VYBORA - iOS iPhone
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: VYBORA-APPLE

    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.vybora.app

      vars:
        XCODE_SCHEME: "VYBORA"

      xcode: latest

    scripts:
      - name: "1 - Verificar projeto iOS"
        script: |
          set -eu

          cd "$CM_BUILD_DIR"

          echo "=== VYBORA iOS ==="

          if [ ! -d "ios" ]; then
            echo "ERRO: pasta ios nao encontrada."
            echo "O projeto precisa ter uma versao iOS."
            exit 1
          fi

          find ios -maxdepth 5 \
            \( -name "*.xcworkspace" -o -name "*.xcodeproj" \) \
            -print

      - name: "2 - Localizar projeto Xcode"
        script: |
          set -eu
          cd "$CM_BUILD_DIR"

          WORKSPACE="$(find ios -maxdepth 5 \
            -name "*.xcworkspace" -print -quit || true)"

          PROJECT="$(find ios -maxdepth 5 \
            -name "*.xcodeproj" -print -quit || true)"

          if [ -n "$WORKSPACE" ]; then
            echo "BUILD_TYPE=workspace" >> "$CM_ENV"
            echo "BUILD_PATH=$CM_BUILD_DIR/$WORKSPACE" >> "$CM_ENV"
          elif [ -n "$PROJECT" ]; then
            echo "BUILD_TYPE=project" >> "$CM_ENV"
            echo "BUILD_PATH=$CM_BUILD_DIR/$PROJECT" >> "$CM_ENV"
          else
            echo "ERRO: nenhum projeto Xcode encontrado."
            exit 1
          fi

      - name: "3 - Identificar esquema"
        script: |
          set -eu

          if [ "$BUILD_TYPE" = "workspace" ]; then
            xcodebuild -list -workspace "$BUILD_PATH"
          else
            xcodebuild -list -project "$BUILD_PATH"
          fi

      - name: "4 - Compilar aplicativo iOS"
        script: |
          set -eu

          mkdir -p "$CM_BUILD_DIR/build/ios"

          if [ "$BUILD_TYPE" = "workspace" ]; then
            xcodebuild \
              -workspace "$BUILD_PATH" \
              -scheme "$XCODE_SCHEME" \
              -configuration Debug \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$CM_BUILD_DIR/build/ios" \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            xcodebuild \
              -project "$BUILD_PATH" \
              -scheme "$XCODE_SCHEME" \
              -configuration Debug \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$CM_BUILD_DIR/build/ios" \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi

      - name: "5 - Verificar aplicativo compilado"
        script: |
          set -eu

          APP_PATH="$CM_BUILD_DIR/build/ios/Build/Products/Debug-iphoneos"

          APP_FILE="$(find "$APP_PATH" \
            -maxdepth 1 -name "*.app" -print -quit || true)"

          if [ -z "$APP_FILE" ]; then
            echo "ERRO: aplicativo .app nao encontrado."
            exit 1
          fi

          echo "Aplicativo compilado: $APP_FILE"
          mkdir -p "$CM_EXPORT_DIR"
          ditto "$APP_FILE" "$CM_EXPORT_DIR/VYBORA.app"

    artifacts:
      - $CM_EXPORT_DIR/VYBORA.app
      - build/ios/Build/Products/**/*.app
