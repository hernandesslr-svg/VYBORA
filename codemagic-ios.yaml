
workflows:
  vybora-ios:
    name: VYBORA - iOS iPhone
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: VYBORA-APPLE

    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.vybora.app
      vars:
        XCODE_SCHEME: "Vybora"
      xcode: latest

    scripts:
      - name: "1 - Extrair projeto iOS"
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          ZIP="$CM_BUILD_DIR/VYBORA-IOS-PORTADO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: VYBORA-IOS-PORTADO.zip não encontrado na raiz do GitHub."
            ls -la
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/ios-extraido"
          unzip -o "$ZIP" -d "$CM_BUILD_DIR/ios-extraido"

          IOS_DIR="$(find "$CM_BUILD_DIR/ios-extraido" -type d -name ios -print -quit)"

          if [ -z "$IOS_DIR" ]; then
            echo "ERRO: pasta ios não encontrada dentro do ZIP."
            exit 1
          fi

          cp -R "$IOS_DIR" "$CM_BUILD_DIR/ios"

          PROJECT="$(find "$CM_BUILD_DIR/ios" -maxdepth 3 -name '*.xcodeproj' -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "ERRO: projeto Xcode não encontrado."
            find "$CM_BUILD_DIR/ios" -maxdepth 4 -print
            exit 1
          fi

          echo "Projeto Xcode encontrado: $PROJECT"

      - name: "2 - Verificar projeto Xcode"
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          xcodebuild -list -project "$(find ios -maxdepth 3 -name '*.xcodeproj' -print -quit)"

      - name: "3 - Compilar aplicativo iOS"
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          PROJECT="$(find ios -maxdepth 3 -name '*.xcodeproj' -print -quit)"
          mkdir -p "$CM_BUILD_DIR/build/ios"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/DerivedData/Build/Products/Debug-iphoneos/*.app
      - build/DerivedData/Logs/**/*.log
