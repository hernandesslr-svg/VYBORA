workflows:
  vybora-android:
    name: VYBORA - Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
        - tag

    scripts:
      - name: "1 - Verificar e extrair os pacotes"
        script: |
          set -eu
          ROOT="$CM_BUILD_DIR"
          WORK="$ROOT/.vybora_build"
          APP_ZIP="$ROOT/VYBORA-POSTAR-CORRIGIDO.zip"
          ICON_ZIP="$ROOT/VYBORA-ANDROID-ICON-RESOURCES.zip"

          echo "=== ARQUIVOS NA RAIZ ==="
          ls -lah "$ROOT"

          [ -f "$APP_ZIP" ] || {
            echo "ERRO: VYBORA-POSTAR-CORRIGIDO.zip nao encontrado."
            exit 1
          }

          [ -f "$ICON_ZIP" ] || {
            echo "ERRO: VYBORA-ANDROID-ICON-RESOURCES.zip nao encontrado."
            exit 1
          }

          command -v unzip >/dev/null 2>&1 || {
            echo "ERRO: unzip indisponivel."
            exit 1
          }

          rm -rf "$WORK"
          mkdir -p "$WORK/projeto" "$WORK/icones"

          unzip -q "$APP_ZIP" -d "$WORK/projeto"
          unzip -q "$ICON_ZIP" -d "$WORK/icones"

          find "$WORK/projeto" -maxdepth 4 -type f -print
          find "$WORK/icones" -maxdepth 4 -type f -print

      - name: "2 - Localizar e validar o projeto"
        script: |
          set -eu
          WORK="$CM_BUILD_DIR/.vybora_build"

          WRAPPER="$(find "$WORK/projeto" \
            -type f -name gradlew \
            -not -path '*/.gradle/*' -print -quit)"

          [ -n "$WRAPPER" ] || {
            echo "ERRO: gradlew nao encontrado."
            exit 1
          }

          PROJECT_DIR="$(dirname "$WRAPPER")"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] &&
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERRO: settings.gradle(.kts) nao encontrado."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERRO: build.gradle(.kts) do modulo app nao encontrado."
            exit 1
          fi

          printf '%s\n' "$PROJECT_DIR" > "$WORK/project_dir.txt"
          echo "Projeto Android: $PROJECT_DIR"

      - name: "3 - Preparar manifesto Android"
        script: |
          set -eu
          WORK="$CM_BUILD_DIR/.vybora_build"
          PROJECT_DIR="$(cat "$WORK/project_dir.txt")"
          APP_DIR="$PROJECT_DIR/app"
          SOURCE_MANIFEST="$APP_DIR/AndroidManifest.xml"
          TARGET_MANIFEST="$APP_DIR/src/main/AndroidManifest.xml"

          if [ -s "$SOURCE_MANIFEST" ]; then
            mkdir -p "$APP_DIR/src/main"
            cp "$SOURCE_MANIFEST" "$TARGET_MANIFEST"
          elif [ ! -s "$TARGET_MANIFEST" ]; then
            echo "ERRO: AndroidManifest.xml nao encontrado."
            find "$APP_DIR" -name AndroidManifest.xml -print
            exit 1
          fi

          ls -lh "$TARGET_MANIFEST"

      - name: "4 - Incorporar recursos do icone"
        script: |
          set -eu
          WORK="$CM_BUILD_DIR/.vybora_build"
          PROJECT_DIR="$(cat "$WORK/project_dir.txt")"
          ICON_RES="$WORK/icones/res"
          TARGET_RES="$PROJECT_DIR/app/src/main/res"

          if [ ! -d "$ICON_RES" ]; then
            ICON_RES="$(find "$WORK/icones" \
              -type d -name res -print -quit)"
          fi

          [ -n "$ICON_RES" ] && [ -d "$ICON_RES" ] || {
            echo "ERRO: pasta res nao encontrada."
            exit 1
          }

          mkdir -p "$TARGET_RES"
          cp -R "$ICON_RES/." "$TARGET_RES/"

          if ! find "$TARGET_RES" -type f \
            -name 'ic_launcher*' -print -quit | grep -q .; then
            echo "ERRO: nenhum recurso ic_launcher encontrado."
            exit 1
          fi

          echo "Recursos do icone incorporados."

      - name: "5 - Configurar Android SDK"
        script: |
          set -eu
          WORK="$CM_BUILD_DIR/.vybora_build"
          PROJECT_DIR="$(cat "$WORK/project_dir.txt")"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          [ -n "$SDK" ] && [ -d "$SDK" ] || {
            echo "ERRO: Android SDK nao encontrado."
            exit 1
          }

          printf 'sdk.dir=%s\n' "$SDK" \
            > "$PROJECT_DIR/local.properties"

          chmod +x "$PROJECT_DIR/gradlew"
          java -version

      - name: "6 - Compilar APK"
        script: |
          set -eu
          WORK="$CM_BUILD_DIR/.vybora_build"
          PROJECT_DIR="$(cat "$WORK/project_dir.txt")"
          cd "$PROJECT_DIR"

          ./gradlew --version
          ./gradlew assembleDebug --no-daemon --stacktrace

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          [ -s "$APK" ] || {
            echo "ERRO: APK nao encontrado."
            find "$PROJECT_DIR" -path '*/build/outputs/*' \
              -type f -print
            exit 1
          }

          ls -lh "$APK"

      - name: "7 - Exportar APK"
        script: |
          set -eu
          WORK="$CM_BUILD_DIR/.vybora_build"
          PROJECT_DIR="$(cat "$WORK/project_dir.txt")"
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          [ -s "$APK" ] || {
            echo "ERRO: APK indisponivel."
            exit 1
          }

          mkdir -p "$CM_EXPORT_DIR"
          cp "$APK" "$CM_EXPORT_DIR/VYBORA-debug.apk"
          ls -lh "$CM_EXPORT_DIR/VYBORA-debug.apk"

    artifacts:
      - $CM_EXPORT_DIR/VYBORA-debug.apk

  vybora-ios:
    name: VYBORA - iOS iPhone
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      vars:
        XCODE_SCHEME: "Vybora"
      xcode: latest

    triggering:
      events:
        - push
        - tag
      cancel_previous_builds: true

    scripts:
      - name: "1 - Extrair e localizar projeto iOS"
        script: |
          set -eu

          ROOT="$CM_BUILD_DIR"
          ZIP="$ROOT/VYBORA-IOS-PORTADO.zip"
          WORK="$ROOT/.vybora_ios_build"

          [ -f "$ZIP" ] || {
            echo "ERRO: VYBORA-IOS-PORTADO.zip nao encontrado."
            ls -lah "$ROOT"
            exit 1
          }

          command -v unzip >/dev/null 2>&1 || {
            echo "ERRO: unzip indisponivel."
            exit 1
          }

          rm -rf "$WORK"
          mkdir -p "$WORK/source" "$WORK/output"

          unzip -q "$ZIP" -d "$WORK/source"

          echo "=== PROCURANDO PROJETO XCODE ==="

          PROJECT="$(find "$WORK/source" \
            -type d -name '*.xcodeproj' \
            -not -path '*/Pods/*' -print -quit)"

          WORKSPACE=""

          if [ -z "$PROJECT" ]; then
            WORKSPACE="$(find "$WORK/source" \
              -type d -name '*.xcworkspace' \
              -not -path '*/Pods/*' -print -quit)"
          fi

          if [ -z "$PROJECT" ] && [ -z "$WORKSPACE" ]; then
            echo "ERRO: nenhum .xcodeproj ou .xcworkspace encontrado."
            find "$WORK/source" -maxdepth 6 -print
            exit 1
          fi

          if [ -n "$WORKSPACE" ]; then
            printf '%s\n' "$WORKSPACE" > "$WORK/workspace.txt"
            : > "$WORK/project.txt"
            echo "Workspace: $WORKSPACE"
          else
            printf '%s\n' "$PROJECT" > "$WORK/project.txt"
            : > "$WORK/workspace.txt"
            echo "Projeto: $PROJECT"
          fi

          echo "=== ARQUIVOS DE CONFIGURACAO ==="
          find "$WORK/source" -maxdepth 6 \
            \( -name Podfile -o -name Package.swift \
            -o -name '*.xcscheme' \) -print

      - name: "2 - Verificar esquema Xcode e dependencias"
        script: |
          set -eu

          WORK="$CM_BUILD_DIR/.vybora_ios_build"
          PROJECT="$(cat "$WORK/project.txt")"
          WORKSPACE="$(cat "$WORK/workspace.txt")"

          if [ -n "$WORKSPACE" ]; then
            xcodebuild -list -workspace "$WORKSPACE"
          else
            xcodebuild -list -project "$PROJECT"
          fi

          echo "Esquema configurado: $XCODE_SCHEME"

          if [ -n "$WORKSPACE" ]; then
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$XCODE_SCHEME" \
              -showBuildSettings >/dev/null
          else
            xcodebuild \
              -project "$PROJECT" \
              -scheme "$XCODE_SCHEME" \
              -showBuildSettings >/dev/null
          fi

      - name: "3 - Instalar dependencias CocoaPods, se necessario"
        script: |
          set -eu

          WORK="$CM_BUILD_DIR/.vybora_ios_build"
          SOURCE="$WORK/source"

          PODFILE="$(find "$SOURCE" -type f \
            -name Podfile -not -path '*/Pods/*' -print -quit)"

          if [ -n "$PODFILE" ]; then
            command -v pod >/dev/null 2>&1 || {
              echo "ERRO: Podfile existe, mas CocoaPods nao esta disponivel."
              exit 1
            }

            cd "$(dirname "$PODFILE")"
            pod install
          else
            echo "Podfile nao encontrado; etapa ignorada."
          fi

      - name: "4 - Compilar aplicativo para iPhone"
        script: |
          set -eu

          WORK="$CM_BUILD_DIR/.vybora_ios_build"
          PROJECT="$(cat "$WORK/project.txt")"
          WORKSPACE="$(cat "$WORK/workspace.txt")"
          DERIVED="$WORK/DerivedData"

          mkdir -p "$DERIVED"

          if [ -n "$WORKSPACE" ]; then
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$XCODE_SCHEME" \
              -configuration Debug \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$DERIVED" \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            xcodebuild \
              -project "$PROJECT" \
              -scheme "$XCODE_SCHEME" \
              -configuration Debug \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$DERIVED" \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi

      - name: "5 - Verificar e exportar aplicativo iOS"
        script: |
          set -eu

          WORK="$CM_BUILD_DIR/.vybora_ios_build"
          DERIVED="$WORK/DerivedData"
          OUTPUT="$CM_EXPORT_DIR/VYBORA-iOS"

          APP="$(find "$DERIVED/Build/Products" \
            -maxdepth 3 -type d -name '*.app' \
            -not -path '*/Simulator/*' -print -quit)"

          [ -n "$APP" ] && [ -d "$APP" ] || {
            echo "ERRO: aplicativo .app nao encontrado."
            find "$DERIVED/Build/Products" -maxdepth 5 -print
            exit 1
          }

          mkdir -p "$OUTPUT"
          ditto "$APP" "$OUTPUT/$(basename "$APP")"

          echo "Aplicativo compilado:"
          ls -ld "$OUTPUT/$(basename "$APP")"

          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' \
            "$APP/Info.plist"

      - name: "6 - Registrar diagnosticos da compilacao"
        script: |
          set -eu

          WORK="$CM_BUILD_DIR/.vybora_ios_build"
          LOGS="$WORK/DerivedData/Logs"

          mkdir -p "$CM_EXPORT_DIR/VYBORA-iOS-Logs"

          if [ -d "$LOGS" ]; then
            cp -R "$LOGS/." \
              "$CM_EXPORT_DIR/VYBORA-iOS-Logs/"
          fi

          echo "Diagnosticos exportados, quando disponiveis."

    artifacts:
      - $CM_EXPORT_DIR/VYBORA-iOS/**/*.app
      - $CM_EXPORT_DIR/VYBORA-iOS-Logs/**/*
