workflows:
  vybora-android:
    name: VYBORA - Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17
      node: 20

    triggering:
      events:
        - push
        - tag

    scripts:
      - name: Verificar projeto
        script: |
          set -eu

          echo "======================================"
          echo " VYBORA - VERIFICACAO DO PROJETO"
          echo "======================================"

          ls -la

          WRAPPER="$(find . -type f -name gradlew \
            -not -path '*/.git/*' -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "ERRO: Gradle Wrapper nao encontrado."
            echo "Verifique se o projeto Android esta no repositorio."
            exit 1
          fi

          echo "Gradle Wrapper encontrado: $WRAPPER"

      - name: Compilar APK Android
        script: |
          set -eu

          WRAPPER="$(find . -type f -name gradlew \
            -not -path '*/.git/*' -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "ERRO: gradlew nao encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"

          echo "Diretorio do projeto: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          chmod +x ./gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Exportar APK
        script: |
          set -eu

          mkdir -p "$CM_EXPORT_DIR"

          find . -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -not -path '*/.gradle/*' \
            -exec cp {} "$CM_EXPORT_DIR/" \;

          APK="$(find "$CM_EXPORT_DIR" -maxdepth 1 \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK foi gerado."
            exit 1
          fi

          echo "APK pronto para exportacao:"
          ls -lh "$CM_EXPORT_DIR"/*.apk

    artifacts:
      - $CM_EXPORT_DIR/*.apk
      - "**/build/outputs/apk/**/*.apk"
