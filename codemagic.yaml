workflows:
  vybora-android:
    name: VYBORA - Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
        - tag

    scripts:
      - name: 1 - Extrair os pacotes
        script: |
          set -eu

          ROOT="$CM_BUILD_DIR"
          WORK="$ROOT/.vybora_build"

          APP_ZIP="$ROOT/VYBORA-ANDROID-CORRIGIDO.zip"
          ICON_ZIP="$ROOT/VYBORA-ANDROID-ICON-RESOURCES.zip"

          echo "=== ARQUIVOS DO REPOSITORIO ==="
          ls -lah "$ROOT"

          if [ ! -f "$APP_ZIP" ]; then
            echo "ERRO: VYBORA-ANDROID-CORRIGIDO.zip nao encontrado."
            exit 1
          fi

          if [ ! -f "$ICON_ZIP" ]; then
            echo "ERRO: VYBORA-ANDROID-ICON-RESOURCES.zip nao encontrado."
            exit 1
          fi

          rm -rf "$WORK"
          mkdir -p "$WORK/projeto" "$WORK/icones"

          echo "Extraindo projeto principal..."
          unzip -q "$APP_ZIP" -d "$WORK/projeto"

          echo "Extraindo recursos do icone..."
          unzip -q "$ICON_ZIP" -d "$WORK/icones"

          echo "=== ESTRUTURA EXTRAIDA ==="
          find "$WORK" -maxdepth 4 -print

      - name: 2 - Localizar o projeto Android
        script: |
          set -eu

          ROOT="$CM_BUILD_DIR"
          WORK="$ROOT/.vybora_build"

          WRAPPER="$(find "$WORK/projeto" \
            -type f -name gradlew \
            -not -path '*/.git/*' \
            -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "ERRO: gradlew nao encontrado no pacote extraido."
            echo "Conteudo do pacote principal:"
            find "$WORK/projeto" -maxdepth 6 -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] &&
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERRO: settings.gradle nao encontrado."
            echo "Diretorio localizado: $PROJECT_DIR"
            exit 1
          fi

          printf '%s\n' "$PROJECT_DIR" > "$WORK/project_dir.txt"

          echo "Projeto Android localizado:"
          cat "$WORK/project_dir.txt"

      - name: 3 - Integrar recursos do icone
        script: |
          set -eu

          WORK="$CM_BUILD_DIR/.vybora_build"
          PROJECT_DIR="$(cat "$WORK/project_dir.txt")"
          ICON_DIR="$WORK/icones"

          APP_DIR=""

          if [ -d "$PROJECT_DIR/app/src/main" ]; then
            APP_DIR="$PROJECT_DIR/app"
          else
            MANIFEST="$(find "$PROJECT_DIR" \
              -path '*/src/main/AndroidManifest.xml' \
              -not -path '*/build/*' \
              -print -quit)"

            if [ -n "$MANIFEST" ]; then
              MAIN_DIR="$(dirname "$MANIFEST")"
              APP_DIR="$(dirname "$(dirname "$MAIN_DIR")")"
            fi
          fi

          if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR/src/main" ]; then
            echo "ERRO: modulo Android nao encontrado."
            find "$PROJECT_DIR" -maxdepth 5 -print
            exit 1
          fi

          TARGET_RES="$APP_DIR/src/main/res"
          mkdir -p "$TARGET_RES"

          FOUND_RES=0

          while IFS= read -r -d '' RES_DIR; do
            FOUND_RES=1
            echo "Integrando recursos de: $RES_DIR"

            find "$RES_DIR" -mindepth 1 -maxdepth 1 \
              -type d -print0 |
            while IFS= read -r -d '' RESOURCE_DIR; do
              RESOURCE_NAME="$(basename "$RESOURCE_DIR")"

              case "$RESOURCE_NAME" in
                mipmap*|drawable*|values*)
                  mkdir -p "$TARGET_RES/$RESOURCE_NAME"
                  ditto "$RESOURCE_DIR" \
                    "$TARGET_RES/$RESOURCE_NAME"
                  ;;
              esac
            done

          done < <(find "$ICON_DIR" -type d -name res -print0)

          if [ "$FOUND_RES" -eq 0 ]; then
            echo "ERRO: nenhuma pasta res encontrada no pacote do icone."
            echo "Conteudo do ZIP de recursos:"
            find "$ICON_DIR" -maxdepth 6 -print
            exit 1
          fi

          echo "=== RECURSOS ANDROID DISPONIVEIS ==="
          find "$TARGET_RES" -maxdepth 2 -print

      - name: 4 - Configurar Android SDK
        script: |
          set -eu

          WORK="$CM_BUILD_DIR/.vybora_build"
          PROJECT_DIR="$(cat "$WORK/project_dir.txt")"

          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "ERRO: ANDROID_SDK_ROOT nao definido."
            exit 1
          fi

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" \
            > "$PROJECT_DIR/local.properties"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Android SDK configurado."
          echo "Diretorio: $PROJECT_DIR"

      - name: 5 - Verificar Gradle
        script: |
          set -eu

          WORK="$CM_BUILD_DIR/.vybora_build"
          PROJECT_DIR="$(cat "$WORK/project_dir.txt")"

          cd "$PROJECT_DIR"

          ./gradlew --version
          ./gradlew tasks --no-daemon

      - name: 6 - Compilar APK
        script: |
          set -eu

          WORK="$CM_BUILD_DIR/.vybora_build"
          PROJECT_DIR="$(cat "$WORK/project_dir.txt")"

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: 7 - Exportar APK
        script: |
          set -eu

          WORK="$CM_BUILD_DIR/.vybora_build"
          PROJECT_DIR="$(cat "$WORK/project_dir.txt")"

          mkdir -p "$CM_EXPORT_DIR"

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK foi gerado."
            find "$PROJECT_DIR" \
              -path '*/build/outputs/*' \
              -type f -print
            exit 1
          fi

          cp "$APK" "$CM_EXPORT_DIR/VYBORA-debug.apk"

          echo "=== APK GERADO ==="
          ls -lh "$CM_EXPORT_DIR/VYBORA-debug.apk"

    artifacts:
      - $CM_EXPORT_DIR/*.apk
