workflows:
  vybora-android:
    name: VYBORA - Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
        - tag

    scripts:
      - name: 1 - Extrair pacotes
        script: |
          set -eu

          ROOT="$CM_BUILD_DIR"
          WORK="$ROOT/.vybora_build"

          APP_ZIP="$ROOT/VYBORA-ANDROID-CORRIGIDO.zip"
          ICON_ZIP="$ROOT/VYBORA-ANDROID-ICON-RESOURCES.zip"

          test -f "$APP_ZIP" || {
            echo "ERRO: ZIP principal nao encontrado."
            exit 1
          }

          test -f "$ICON_ZIP" || {
            echo "ERRO: ZIP do icone nao encontrado."
            exit 1
          }

          rm -rf "$WORK"
          mkdir -p "$WORK/projeto" "$WORK/icones"

          unzip -q "$APP_ZIP" -d "$WORK/projeto"
          unzip -q "$ICON_ZIP" -d "$WORK/icones"

          echo "ZIPs extraidos."
          find "$WORK/projeto" -maxdepth 4 -print

      - name: 2 - Localizar projeto Android
        script: |
          set -eu

          WORK="$CM_BUILD_DIR/.vybora_build"

          WRAPPER="$(find "$WORK/projeto" \
            -type f -name gradlew \
            -not -path '*/.git/*' \
            -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "ERRO: gradlew nao encontrado dentro do ZIP principal."
            echo "Arquivos de configuracao encontrados:"
            find "$WORK/projeto" -type f \
              \( -name 'settings.gradle' \
              -o -name 'settings.gradle.kts' \
              -o -name 'build.gradle' \
              -o -name 'build.gradle.kts' \
              -o -name 'gradle-wrapper.properties' \) -print
            echo "Conteudo do ZIP:"
            find "$WORK/projeto" -maxdepth 5 -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] &&
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERRO: settings.gradle nao encontrado junto ao gradlew."
            exit 1
          fi

          printf '%s\n' "$PROJECT_DIR" > "$WORK/project_dir.txt"
          echo "Projeto localizado: $PROJECT_DIR"

      - name: 3 - Integrar recursos do icone
        script: |
          set -eu

          WORK="$CM_BUILD_DIR/.vybora_build"
          PROJECT_DIR="$(cat "$WORK/project_dir.txt")"
          ICON_DIR="$WORK/icones"

          MANIFEST="$(find "$PROJECT_DIR" \
            -path '*/src/main/AndroidManifest.xml' \
            -not -path '*/build/*' \
            -print -quit)"

          if [ -z "$MANIFEST" ]; then
            echo "ERRO: AndroidManifest.xml nao encontrado."
            exit 1
          fi

          MAIN_DIR="$(dirname "$MANIFEST")"
          APP_DIR="$(dirname "$(dirname "$MAIN_DIR")")"
          TARGET_RES="$MAIN_DIR/res"

          mkdir -p "$TARGET_RES"

          RES_FOUND=0

          while IFS= read -r -d '' SRC_RES; do
            RES_FOUND=1

            for RESOURCE_DIR in "$SRC_RES"/*; do
              [ -d "$RESOURCE_DIR" ] || continue

              NAME="$(basename "$RESOURCE_DIR")"

              case "$NAME" in
                mipmap*|drawable*|values*)
                  mkdir -p "$TARGET_RES/$NAME"
                  ditto "$RESOURCE_DIR" "$TARGET_RES/$NAME"
                  ;;
              esac
            done
          done < <(find "$ICON_DIR" -type d -name res -print0)

          if [ "$RES_FOUND" -eq 0 ]; then
            echo "ERRO: pasta res nao encontrada no ZIP de icones."
            find "$ICON_DIR" -maxdepth 6 -print
            exit 1
          fi

          echo "Modulo Android: $APP_DIR"
          echo "Recursos de icone integrados."

      - name: 4 - Configurar SDK
        script: |
          set -eu

          WORK="$CM_BUILD_DIR/.vybora_build"
          PROJECT_DIR="$(cat "$WORK/project_dir.txt")"

          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "ERRO: ANDROID_SDK_ROOT nao definido."
            exit 1
          fi

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" \
            > "$PROJECT_DIR/local.properties"

          chmod +x "$PROJECT_DIR/gradlew"

      - name: 5 - Compilar e mostrar causa do erro
        script: |
          set -u

          WORK="$CM_BUILD_DIR/.vybora_build"
          PROJECT_DIR="$(cat "$WORK/project_dir.txt")"
          LOG="$WORK/gradle-build.log"

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info > "$LOG" 2>&1
          RESULT=$?

          cat "$LOG"

          if [ "$RESULT" -ne 0 ]; then
            echo "===== RESUMO DO ERRO GRADLE ====="
            grep -n -A 15 -B 3 \
              -E 'What went wrong:|Where:|Caused by:|Could not resolve|Could not find|Compilation error|Execution failed for task' \
              "$LOG" | tail -160 || true
            exit "$RESULT"
          fi

      - name: 6 - Exportar APK
        script: |
          set -eu

          WORK="$CM_BUILD_DIR/.vybora_build"
          PROJECT_DIR="$(cat "$WORK/project_dir.txt")"

          mkdir -p "$CM_EXPORT_DIR"

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERRO: APK nao encontrado apos a compilacao."
            find "$PROJECT_DIR" -path '*/build/outputs/*' \
              -type f -print
            exit 1
          fi

          cp "$APK" "$CM_EXPORT_DIR/VYBORA-debug.apk"
          ls -lh "$CM_EXPORT_DIR/VYBORA-debug.apk"

    artifacts:
      - $CM_EXPORT_DIR/*.apk
