workflows:
  vybora-android:
    name: VYBORA - Android APK
    max_build_duration: 60
    instance_type: linux

    environment:
      java: 17
      node: 20

    triggering:
      events:
        - push
        - tag

    scripts:
      - name: Verificar projeto
        script: |
          set -eu
          echo "Verificando estrutura do VYBORA..."
          ls -la

          WRAPPER="$(find . -type f -name gradlew -not -path '*/.git/*' -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "ERRO: Gradle Wrapper (gradlew) não encontrado."
            echo "Este fluxo exige um projeto Android Gradle já preparado."
            exit 1
          fi

          echo "Gradle Wrapper encontrado: $WRAPPER"

      - name: Compilar APK
        script: |
          set -eu

          WRAPPER="$(find . -type f -name gradlew -not -path '*/.git/*' -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "ERRO: Gradle Wrapper não encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"
          cd "$PROJECT_DIR"

          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar APK
        script: |
          set -eu
          mkdir -p "$CM_EXPORT_DIR"

          find . -type f -path '*/build/outputs/apk/debug/*.apk' \
            -exec cp {} "$CM_EXPORT_DIR/" \;

          if ! find "$CM_EXPORT_DIR" -type f -name '*.apk' -print -quit | grep -q .; then
            echo "ERRO: a compilação terminou sem gerar um APK."
            exit 1
          fi

          echo "APK preparado para download:"
          find "$CM_EXPORT_DIR" -type f -name '*.apk' -print

    artifacts:
      - $CM_EXPORT_DIR/*.apk
      - "**/build/outputs/apk/**/*.apk"
