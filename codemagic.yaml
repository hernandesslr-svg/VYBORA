workflows:
  vybora-android:
    name: VYBORA - Android APK
    max_build_duration: 60
    instance_type: linux

    environment:
      java: 17
      node: 20

    triggering:
      events:
        - push
        - tag
        - workflow_dispatch

    scripts:
      - name: Verificar projeto
        script: |
          set -eu
          echo "Verificando estrutura do VYBORA..."
          ls -la

          if [ -f "gradlew" ]; then
            echo "Projeto Android Gradle encontrado na raiz."
          elif [ -f "package.json" ]; then
            echo "Projeto JavaScript/Expo encontrado."
            echo "Este workflow precisa do projeto Android nativo para compilar diretamente."
            exit 1
          else
            WRAPPER="$(find . -type f -name gradlew \
              -not -path '*/.git/*' -print -quit)"

            if [ -z "$WRAPPER" ]; then
              echo "ERRO: Gradle Wrapper não encontrado."
              exit 1
            fi

            echo "Gradle Wrapper encontrado: $WRAPPER"
          fi

      - name: Compilar APK
        script: |
          set -eu

          WRAPPER="$(find . -type f -name gradlew \
            -not -path '*/.git/*' -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "ERRO: não existe Gradle Wrapper."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar APK
        script: |
          set -eu
          mkdir -p "$CM_EXPORT_DIR"

          find . -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -exec cp {} "$CM_EXPORT_DIR/" \;

          if ! find "$CM_EXPORT_DIR" -type f \
            -name '*.apk' -print -quit | grep -q .; then
            echo "ERRO: o APK não foi gerado."
            exit 1
          fi

    artifacts:
      - $CM_EXPORT_DIR/*.apk
      - "**/build/outputs/apk/**/*.apk"
